name: Build Word Game APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    # 22.04 keeps libtinfo5 available (same as the Colab setup)
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip \
            libffi-dev libssl-dev autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 cmake

      - name: Install Python dependencies
        run: pip install buildozer cython

      - name: Cache Buildozer (SDK, NDK, build)
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Check required files
        run: |
          missing=0
          for f in main.py wordduel.kv game_logic.py NotoHebrew.ttf NotoHebrewBold.ttf VarelaRound-Regular.ttf; do
            if [ -f "$f" ]; then echo "OK       $f"; else echo "MISSING  $f"; missing=1; fi
          done
          if [ "$missing" = "1" ]; then echo "Add the missing files to the repo root."; exit 1; fi

      - name: Build APK
        env:
          BUILDOZER_WARN_ON_ROOT: "0"
        run: buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: thewordgame-apk
          path: bin/*.apk
          if-no-files-found: error
